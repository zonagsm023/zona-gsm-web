    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { min-height: 100vh; background: linear-gradient(180deg, #eef3f8 0%, #e4ebf2 100%); display: flex; justify-content: center; align-items: flex-start; padding: 0 0 48px; color: #111827; overflow-x: hidden; }

    .preloader { position: fixed; inset: 0; background: linear-gradient(180deg, #eef3f8 0%, #e4ebf2 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.65s ease, visibility 0.65s ease; }

    .loader-circle-wrap { position: relative; width: 124px; height: 124px; display: flex; align-items: center; justify-content: center; animation: loaderPopIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes loaderPopIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .loader-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(200, 29, 78, 0.35); background: rgba(200, 29, 78, 0.05); animation: loaderPulse 1.4s ease-in-out infinite; }
    .loader-ring-2 { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(200, 29, 78, 0.2); animation: loaderPulse 1.4s ease-in-out 0.35s infinite; }
    @keyframes loaderPulse { 0% { transform: scale(0.98); opacity: 0.9; } 70%, 100% { transform: scale(1.24); opacity: 0; } }

    .container { width: 100%; max-width: 460px; background: #f4f7fa; border-radius: 0 0 28px 28px; padding: 0 0 32px; box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08); border: 1px solid rgba(255, 255, 255, 0.85); border-top: none; text-align: center; overflow: hidden; position: relative; opacity: 0; transform: translateY(14px); transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1), transform 0.75s cubic-bezier(0.22, 1, 0.36, 1); }

    .mountain-divider { position: absolute; bottom: -1px; left: 0; width: 100%; height: 36px; fill: #f4f7fa; display: block; }

    .avatar-wrapper { position: relative; width: 118px; height: 118px; margin: -68px auto 18px; z-index: 2; display: flex; align-items: center; justify-content: center; }
    .avatar { width: 114px; height: 114px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.1); position: relative; z-index: 3; overflow: hidden; }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; filter: contrast(1.08) brightness(1.04); display: block; }
    .avatar-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #ffffff; }

    .logo-zona { background: #c81d4e; color: #ffffff; padding: 3px 6px; border-radius: 2px; margin-right: 4px; }
    .logo-gsm { color: #0f0f0f; }

    .pulse-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 1.5px solid rgba(200, 29, 78, 0.32); background: rgba(200, 29, 78, 0.05); pointer-events: none; z-index: 1; }
    .ring-1 { animation: breatheRing1 4.2s ease-in-out infinite; }
    .ring-2 { border-color: rgba(200, 29, 78, 0.2); background: rgba(200, 29, 78, 0.03); animation: breatheRing2 4.2s ease-in-out infinite; }
    @keyframes breatheRing1 { 0%, 100% { transform: scale(1.03); opacity: 0.85; } 50% { transform: scale(1.11); opacity: 0.45; } }
    @keyframes breatheRing2 { 0%, 100% { transform: scale(1.06); opacity: 0.65; } 50% { transform: scale(1.19); opacity: 0.2; } }

    @keyframes subtleHop { 0%, 78%, 100% { transform: translateY(0); } 84% { transform: translateY(-5px); } 90% { transform: translateY(0); } 94% { transform: translateY(-2px); } }
    .socials { display: flex; justify-content: center; align-items: flex-start; gap: 10px; margin-bottom: 26px; }
    .social-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; background: none; border: none; cursor: pointer; width: 64px; animation: subtleHop 5s ease-in-out infinite; }
    .social-item:nth-child(1) { animation-delay: 0s; } .social-item:nth-child(2) { animation-delay: 0.3s; } .social-item:nth-child(3) { animation-delay: 0.6s; } .social-item:nth-child(4) { animation-delay: 0.9s; } .social-item:nth-child(5) { animation-delay: 1.2s; }

    .card { background: #ffffff; border-radius: 50px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05); border: 1px solid #eef2f6; text-align: left; text-decoration: none; color: inherit; width: 100%; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }

    .offline-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; background: #fef2f2; border: 1px solid #fecaca; font-size: 10px; font-weight: 700; color: #dc2626; line-height: 1; flex-shrink: 0; }

    .esim-close { width: 28px; height: 28px; border-radius: 50%; border: none; background: #f1f5f9; color: #334155; font-size: 16px; font-weight: 700; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

    .esim-qty-label { font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 8px; }
    .esim-row { display: flex; align-items: center; gap: 8px; }
    .esim-qty-input { width: 92px; padding: 11px 12px; border-radius: 12px; border: 1.5px solid #cbd5e1; font-size: 15px; font-weight: 800; color: #0f172a; text-align: center; outline: none; }
    .esim-qty-input:focus { border-color: #c81d4e; }
    .esim-send-btn { flex: 1; padding: 11px 16px; border: none; border-radius: 12px; background: #25D366; color: #ffffff; font-size: 14px; font-weight: 800; cursor: pointer; transition: background 0.15s ease; }

  <!-- Cuadro modal para elegir cantidad y enviar pedido -->
  <div id="esimOverlay" class="esim-overlay" onclick="closeEsimOutside(event)">
    <div class="esim-box" role="dialog" aria-modal="true" aria-labelledby="esimModalTitle">
      <div class="esim-box-top">
        <div class="esim-op-head">
          <div id="esimModalLogo" class="esim-op-logo"></div>
          <div>
            <div id="esimModalTitle" class="esim-box-title">E-SIM</div>
            <span id="esimModalPrice" class="esim-price-pill">Precio: $0</span>
          </div>
        </div>
        <button type="button" class="esim-close" onclick="closeEsimBox()" aria-label="Cerrar">&times;</button>
      </div>
      <form onsubmit="sendEsimWa(event)">
        <div class="esim-qty-label">Cantidad (líneas nuevas)</div>
        <div class="esim-row">
          <input id="esimQtyField" class="esim-qty-input" type="number" min="1" step="1" value="1" required />
          <button type="submit" class="esim-send-btn">Enviar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast">Copiado</div>

  <script>
    let currentEsimName = '';
    let currentEsimPrice = '';

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('preloader').classList.add('hidden');
        document.getElementById('mainContent').classList.add('visible');
      }, 1400);
    });

    function openEsimBox(opName, logoSrc, fallbackText, bgClass, price, isOnline) {
      if (!isOnline) {
        showToast(opName + ' está OFFLINE');
        return;
      }

      currentEsimName = opName.toUpperCase();
      currentEsimPrice = price;

      const logoWrap = document.getElementById('esimModalLogo');
      logoWrap.className = 'esim-op-logo ' + bgClass;
      logoWrap.innerHTML = '';
      const img = document.createElement('img');
      img.src = logoSrc;
      img.alt = opName;
      img.onerror = function () {
        handleImgError(this, fallbackText, bgClass);
      };
      logoWrap.appendChild(img);

      document.getElementById('esimModalTitle').textContent = currentEsimName;
      document.getElementById('esimModalPrice').textContent = 'Precio: ' + price;

      const qtyInput = document.getElementById('esimQtyField');
      qtyInput.value = '1';
      document.getElementById('esimOverlay').classList.add('open');
      setTimeout(() => {
        qtyInput.focus();
        qtyInput.select();
      }, 50);
    }

    function closeEsimBox() {
      document.getElementById('esimOverlay').classList.remove('open');
    }

    function closeEsimOutside(e) {
      if (e.target.id === 'esimOverlay') {
        closeEsimBox();
      }
    }

    function sendEsimWa(e) {
      e.preventDefault();
      const qtyInput = document.getElementById('esimQtyField');
      const qty = parseInt(qtyInput.value, 10);

      if (!qty || qty < 1) {
        showToast('Ingresa una cantidad válida');
        qtyInput.focus();
        return;
      }

      const text =
        '*' + currentEsimName + '*\n' +
        '*CANTIDAD : ' + qty + '*\n' +
        '*PRECIO: ' + currentEsimPrice + '*';

      const url = 'https://wa.me/573104141805?text=' + encodeURIComponent(text);
      closeEsimBox();
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeEsimBox();
    });

    function handleLogoError(img) {
      img.style.display = 'none';
      const wrap = img.parentElement;
      wrap.innerHTML = '<div class="avatar-fallback"><div class="logo-badge"><span class="logo-zona">Zona</span><span class="logo-gsm">GSM</span></div></div>';
    }
    function handleImgError(img, name, bgClass) {
      const c = img.parentElement; img.style.display = 'none';
      const d = document.createElement('div'); d.className = 'operator-badge-fallback ' + bgClass; d.textContent = name; c.appendChild(d);
    }
    function copyText(text, label) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast(label + ' copiado')).catch(() => fallbackCopy(text, label));
      } else fallbackCopy(text, label);
    }
    function fallbackCopy(text, label) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); showToast(label + ' copiado'); } catch (e) { showToast('No se pudo copiar'); }
      document.body.removeChild(ta);
    }
    function showToast(msg) {
      const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }
    function sharePage() {
      if (navigator.share) navigator.share({ title: 'Zona GSM — E-SIM Colombia', url: window.location.href }).catch(() => copyText(window.location.href, 'Enlace'));
      else copyText(window.location.href, 'Enlace');
    }
  </script>
