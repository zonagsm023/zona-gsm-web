<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plomeros Al Destape</title>
    <style>
        /* Estilos generales para centrar la tarjeta */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a; /* Fondo oscuro para resaltar la tarjeta */
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        /* Contenedor principal de la tarjeta */
        .card {
            background-color: #bce4f4; /* Color de fondo celeste claro */
            width: 100%;
            max-width: 550px;
            padding: 25px 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            
            /* Efecto de gotas de agua de fondo */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.6) 2px, transparent 3px),
                radial-gradient(circle at 80% 10%, rgba(255,255,255,0.7) 3px, transparent 4px),
                radial-gradient(circle at 50% 80%, rgba(255,255,255,0.5) 2px, transparent 3px),
                radial-gradient(circle at 10% 80%, rgba(255,255,255,0.6) 4px, transparent 5px),
                radial-gradient(circle at 90% 60%, rgba(255,255,255,0.7) 3px, transparent 4px),
                radial-gradient(circle at 30% 50%, rgba(255,255,255,0.5) 1.5px, transparent 2.5px),
                radial-gradient(circle at 70% 90%, rgba(255,255,255,0.6) 2.5px, transparent 3.5px);
            background-size: 150px 150px; /* Tamaño del patrón de gotas */
        }

        /* Contenedor del Logo (Gota + Llave) */
        .logo-container {
            position: relative;
            width: 100px;
            height: 130px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* La Gota de agua */
        .water-drop {
            width: 100%;
            height: 100%;
            fill: #2196d3; /* Azul de la gota */
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1));
        }

        /* La Llave Inglesa */
        .wrench {
            position: absolute;
            width: 50px;
            height: 50px;
            fill: #ffffff; /* Blanca */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%) rotate(45deg); /* Centrada y rotada */
        }

        /* Contenedor del Texto */
        .text-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Título principal */
        .title {
            font-size: 32px;
            font-weight: 900;
            color: #3c464c; /* Gris oscuro */
            line-height: 1.05;
            letter-spacing: 0.5px;
            margin: 0;
            text-transform: uppercase;
        }

        /* Número de teléfono */
        .phone-container {
            display: flex;
            align-items: center;
            margin-top: 12px;
            gap: 8px;
        }

        /* Ícono del teléfono */
        .phone-icon {
            width: 18px;
            height: 18px;
            fill: #3c464c;
        }

        /* Texto del teléfono */
        .phone-number {
            font-size: 18px;
            font-weight: 700;
            color: #3c464c;
            letter-spacing: 0.5px;
        }

        /* Ajustes para pantallas de móviles */
        @media (max-width: 500px) {
            .card {
                flex-direction: column;
                text-align: center;
                padding: 30px 20px;
                gap: 15px;
                margin: 15px;
            }
            .phone-container {
                justify-content: center;
            }
            .title {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        
        <!-- Logo: Gota y Llave -->
        <div class="logo-container">
            <!-- SVG de la Gota -->
            <svg class="water-drop" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 0 C50 0 0 60 0 85 C0 112.6 22.4 130 50 130 C77.6 130 100 112.6 100 85 C100 60 50 0 50 0 Z" />
            </svg>
            <!-- SVG de la Llave Inglesa -->
            <svg class="wrench" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M13.7 2.3c-1.4-.6-3-.6-4.4 0L7.9 3.7l2.1 2.1-1.4 1.4-2.1-2.1L5.1 6.5c-.6 1.4-.6 3 0 4.4l.3.8L2 15.2v4h4l3.5-3.5.8.3c1.4.6 3 .6 4.4 0l1.4-1.4-2.1-2.1 1.4-1.4 2.1 2.1 1.4-1.4c.6-1.4.6-3 0-4.4l-.3-.8L21.9 4v-4h-4l-3.5 3.5-.7-.2z"/>
            </svg>
        </div>

        <!-- Textos -->
        <div class="text-container">
            <h1 class="title">PLOMEROS<br>AL DESTAPE</h1>
            
            <div class="phone-container">
                <!-- SVG Ícono de Teléfono -->
                <svg class="phone-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.03 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                </svg>
                <span class="phone-number">300 302 8182</span>
            </div>
        </div>

    </div>

</body>
</html>
