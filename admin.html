<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración — Zona GSM</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #eef2f6; padding: 20px; color: #111827; margin: 0; }

    /* Estilos del Login */
    .login-box { max-width: 320px; margin: 100px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; }
    .login-box button { width: 100%; padding: 12px; background: #c81d4e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }

    /* Estilos del Panel */
    .panel { display: none; max-width: 1280px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 24px; color: #0f172a; margin: 0; }
    .live-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #059669; font-size: 12px; font-weight: 800; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulseLive 1.6s infinite; }
    @keyframes pulseLive { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.25); } }
    .btn-refresh { padding: 10px 20px; background: #0f172a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

    /* Pestañas (Tabs) */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #cbd5e1; }
    .tab-btn { padding: 10px 20px; background: none; border: none; font-size: 16px; font-weight: 700; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .tab-btn.active { color: #c81d4e; border-bottom-color: #c81d4e; }
    .tab-btn:hover { color: #0f172a; }

    /* Barra de filtro y búsqueda */
    .filter-bar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: white; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-bar label { font-size: 13px; font-weight: 700; color: #334155; }
    .filter-select { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px; font-weight: 600; color: #0f172a; background: #f8fafc; min-width: 210px; outline: none; cursor: pointer; }
    .search-input { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px; font-weight: 600; color: #0f172a; background: #f8fafc; min-width: 220px; outline: none; transition: border-color 0.15s ease, background-color 0.15s ease; }
    .search-input:focus { border-color: #c81d4e; background: #ffffff; }
    .btn-clear { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; color: #475569; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-clear:hover { background: #f1f5f9; color: #0f172a; }

    /* Tablas */
    .table-container { background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 920px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f8fafc; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }

    /* Estados */
    .badge { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-block; }
    .badge-Pendiente { background: #fef3c7; color: #d97706; }
    .badge-Proceso { background: #e0f2fe; color: #0284c7; }
    .badge-Exitoso { background: #dcfce7; color: #16a34a; }
    .badge-Rechazado { background: #fee2e2; color: #dc2626; }
    .badge-Pagado { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .badge-No-Pagado { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

    /* Menús desplegables de acciones */
    select.estado-select, select.pago-select { padding: 7px 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 700; font-size: 12.5px; cursor: pointer; outline: none; background: #f8fafc; color: #334155; width: 100%; max-width: 145px; transition: all 0.2s; }
    select.estado-select:hover, select.pago-select:hover { background: #e2e8f0; }

    /* MODAL CENTRAL DE NUEVA ORDEN */
    .new-order-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 9999; }
    .new-order-overlay.open { display: flex; animation: fadeInModal 0.2s ease; }
    @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }
    .new-order-modal { width: 100%; max-width: 480px; background: #ffffff; border-radius: 22px; overflow: hidden; box-shadow: 0 25px 50px rgba(15, 23, 42, 0.35); border: 2px solid #c81d4e; animation: popModal 0.25s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes popModal { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .new-order-header { background: linear-gradient(135deg, #8a0f33 0%, #c81d4e 100%); color: #ffffff; padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; }
    .new-order-header h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 0.2px; }
    .new-order-queue { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .new-order-body { padding: 20px 22px; }
    .order-detail-grid { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .order-detail-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 8px; }
    .order-detail-row:last-child { border-bottom: none; padding-bottom: 0; }
    .order-detail-label { color: #64748b; font-weight: 700; font-size: 12.5px; text-transform: uppercase; }
    .order-detail-value { color: #0f172a; font-weight: 800; text-align: right; word-break: break-all; }
    .order-detail-value.mono { font-family: monospace; font-size: 15px; background: #eef2f6; padding: 3px 8px; border-radius: 6px; }
    .modal-pago-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; }
    .modal-pago-box label { font-size: 13px; font-weight: 800; color: #334155; }
    .new-order-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-modal-accept { grid-column: 1 / -1; padding: 13px; border: none; border-radius: 12px; background: #0284c7; color: #ffffff; font-size: 15px; font-weight: 800; cursor: pointer; transition: background 0.15s; }
    .btn-modal-accept:hover { background: #0369a1; }
    .btn-modal-reject { padding: 11px; border: none; border-radius: 12px; background: #fee2e2; color: #dc2626; font-size: 13.5px; font-weight: 800; cursor: pointer; transition: background 0.15s; }
    .btn-modal-reject:hover { background: #fecaca; }
    .btn-modal-dismiss { padding: 11px; border: 1px solid #cbd5e1; border-radius: 12px; background: #ffffff; color: #334155; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: background 0.15s; }
    .btn-modal-dismiss:hover { background: #f1f5f9; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginBox" class="login-box">
    <h2 style="margin-top: 0; color: #0f172a;">Zona GSM Admin</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Ingresa tus credenciales</p>
    <input type="text" id="userInput" placeholder="Usuario" value="admin">
    <input type="password" id="passwordInput" placeholder="Contraseña" value="admin">
    <button onclick="login()">Ingresar al Panel</button>
  </div>

  <!-- PANEL -->
  <div id="adminPanel" class="panel">
    <div class="header">
      <div class="header-left">
        <h1>Zona GSM Admin</h1>
        <span class="live-badge"><span class="live-dot"></span>En vivo</span>
      </div>
      <button class="btn-refresh" onclick="recargarTodo()">🔄 Actualizar Datos</button>
    </div>

    <!-- Pestañas -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-orders-btn" onclick="showTab('orders')">Órdenes</button>
      <button class="tab-btn" id="tab-clients-btn" onclick="showTab('clients')">Clientes Registrados</button>
    </div>

    <!-- VISTA: ÓRDENES -->
    <div id="view-orders" class="table-container">
      <div class="filter-bar">
        <div class="filter-group">
          <label for="filtroCliente">Ver órdenes de cliente:</label>
          <select id="filtroCliente" class="filter-select" onchange="aplicarFiltroCliente()">
            <option value="">Todos los clientes</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filtroPago">Pago:</label>
          <select id="filtroPago" class="filter-select" style="min-width: 150px;" onchange="aplicarFiltroCliente()">
            <option value="">Todos</option>
            <option value="Pagado">Pagado</option>
            <option value="No Pagado">No Pagado</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="buscadorOrdenes">Buscar:</label>
          <input type="text" id="buscadorOrdenes" class="search-input" placeholder="N° orden, teléfono, IMEI o cliente..." oninput="aplicarFiltroCliente()">
        </div>
        <button type="button" class="btn-clear" onclick="limpiarFiltroCliente()">Mostrar todos</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Orden</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>WhatsApp</th>
            <th>Servicio</th>
            <th>IMEI</th>
            <th>Precio</th>
            <th>Comprobante</th>
            <th>Pago</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaOrdenes">
          <tr><td colspan="11" style="text-align: center; padding: 30px;">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- VISTA: CLIENTES -->
    <div id="view-clients" class="table-container hidden">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre / Negocio</th>
            <th>Número de WhatsApp</th>
            <th>PIN</th>
          </tr>
        </thead>
        <tbody id="tablaClientes">
          <tr><td colspan="4" style="text-align: center; padding: 30px;">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- AVISO CENTRAL DE NUEVA ORDEN -->
  <div id="newOrderOverlay" class="new-order-overlay">
    <div class="new-order-modal" role="dialog" aria-modal="true" aria-labelledby="newOrderModalTitle">
      <div class="new-order-header">
        <h2 id="newOrderModalTitle">🔔 ¡Nueva Orden Recibida!</h2>
        <span id="newOrderQueueBadge" class="new-order-queue">1 nueva</span>
      </div>
      <div class="new-order-body">
        <div id="newOrderDetails" class="order-detail-grid"></div>
        <div class="modal-pago-box">
          <label for="modalPagoSelect">Estado del pago:</label>
          <select id="modalPagoSelect" class="pago-select" onchange="cambiarPago(ordenActualModal.numero_orden, this.value)">
            <option value="No Pagado">No Pagado</option>
            <option value="Pagado">Pagado</option>
          </select>
        </div>
        <div class="new-order-actions">
          <button type="button" id="btnModalAccept" class="btn-modal-accept" onclick="procesarOrdenModal('En Proceso')">
            ✅ Aceptar y poner En Proceso
          </button>
          <button type="button" id="btnModalReject" class="btn-modal-reject" onclick="procesarOrdenModal('Rechazado')">
            ❌ Rechazar Orden
          </button>
          <button type="button" class="btn-modal-dismiss" onclick="cerrarAvisoNuevaOrden()">
            Ver después en tabla
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://telegram-zonagsm.zonagsm023.workers.dev";
    const SEEN_ORDERS_KEY = "zg_admin_seen_orders";
    const PAYMENT_STATE_KEY = "zg_admin_payment_states";

    let ordenesCache = [];
    let clientesCache = [];
    let colaNuevasOrdenes = [];
    let ordenActualModal = null;
    let adminPollingTimer = null;

    function getEstadosPagoLocales() {
      try {
        return JSON.parse(localStorage.getItem(PAYMENT_STATE_KEY) || "{}");
      } catch (e) {
        return {};
      }
    }

    function guardarEstadoPagoLocal(numeroOrden, estadoPago) {
      if (!numeroOrden) return;
      const mapa = getEstadosPagoLocales();
      mapa[numeroOrden] = estadoPago;
      localStorage.setItem(PAYMENT_STATE_KEY, JSON.stringify(mapa));
    }

    function resolverEstadoPago(orden) {
      if (orden.pago === 'Pagado' || orden.pago === 'No Pagado') {
        return orden.pago;
      }
      const mapa = getEstadosPagoLocales();
      if (orden.numero_orden && mapa[orden.numero_orden]) {
        return mapa[orden.numero_orden];
      }
      return orden.comprobante_url ? 'Pagado' : 'No Pagado';
    }

    function getOrdenesVistas() {
      try {
        return JSON.parse(localStorage.getItem(SEEN_ORDERS_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function marcarOrdenComoVista(numeroOrden) {
      if (!numeroOrden) return;
      const vistas = getOrdenesVistas();
      if (!vistas.includes(numeroOrden)) {
        vistas.push(numeroOrden);
        localStorage.setItem(SEEN_ORDERS_KEY, JSON.stringify(vistas.slice(-300)));
      }
    }

    function reproducirSonidoNuevaOrden() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.42);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.42);
      } catch (e) {}
    }

    function iniciarMonitoreoOrdenes() {
      if (adminPollingTimer) clearInterval(adminPollingTimer);
      adminPollingTimer = setInterval(() => {
        cargarOrdenes(true);
      }, 8000);
    }

    function login() {
      const u = document.getElementById('userInput').value;
      const p = document.getElementById('passwordInput').value;

      if (u === 'admin' && p === 'admin') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        localStorage.setItem('zg_admin_logged', 'true');
        recargarTodo();
        iniciarMonitoreoOrdenes();
      } else {
        alert("Usuario o contraseña incorrectos");
      }
    }

    if (localStorage.getItem('zg_admin_logged') === 'true') {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      recargarTodo();
      iniciarMonitoreoOrdenes();
    }

    function showTab(tabName) {
      document.getElementById('tab-orders-btn').classList.remove('active');
      document.getElementById('tab-clients-btn').classList.remove('active');

      if (tabName === 'orders') {
        document.getElementById('tab-orders-btn').classList.add('active');
        document.getElementById('view-orders').classList.remove('hidden');
        document.getElementById('view-clients').classList.add('hidden');
      } else {
        document.getElementById('tab-clients-btn').classList.add('active');
        document.getElementById('view-clients').classList.remove('hidden');
        document.getElementById('view-orders').classList.add('hidden');
      }
    }

    async function recargarTodo() {
      await Promise.all([cargarClientes(), cargarOrdenes(false)]);
    }

    function poblarFiltroClientes() {
      const select = document.getElementById('filtroCliente');
      const valorActual = select.value;
      select.innerHTML = '<option value="">Todos los clientes</option>';

      clientesCache.forEach(c => {
        const opt = document.createElement('option');
        opt.value = `${c.pin || ''}||${c.celular || ''}`;
        opt.textContent = `${c.nombre || 'Sin nombre'} — ${c.celular || ''} (PIN: ${c.pin || ''})`;
        select.appendChild(opt);
      });

      if (valorActual) {
        select.value = valorActual;
      }
    }

    function aplicarFiltroCliente() {
      renderOrdenes(ordenesCache);
    }

    function limpiarFiltroCliente() {
      document.getElementById('filtroCliente').value = '';
      document.getElementById('filtroPago').value = '';
      document.getElementById('buscadorOrdenes').value = '';
      renderOrdenes(ordenesCache);
    }

    function evaluarNuevasOrdenes(lista) {
      const vistas = getOrdenesVistas();
      if (vistas.length === 0 && lista.length > 0) {
        lista.forEach(o => marcarOrdenComoVista(o.numero_orden));
        return;
      }

      let huboNueva = false;
      lista.forEach(o => {
        const yaVista = vistas.includes(o.numero_orden);
        const enCola = colaNuevasOrdenes.some(item => item.numero_orden === o.numero_orden);
        if (!yaVista && !enCola && o.estado === 'Pendiente') {
          colaNuevasOrdenes.push(o);
          huboNueva = true;
        } else if (!yaVista) {
          marcarOrdenComoVista(o.numero_orden);
        }
      });

      if (huboNueva) {
        reproducirSonidoNuevaOrden();
        mostrarSiguienteOrdenModal();
      }
    }

    function mostrarSiguienteOrdenModal() {
      const overlay = document.getElementById('newOrderOverlay');
      if (colaNuevasOrdenes.length === 0) {
        ordenActualModal = null;
        overlay.classList.remove('open');
        return;
      }

      ordenActualModal = colaNuevasOrdenes[0];
      const o = ordenActualModal;
      const estadoPagoActual = resolverEstadoPago(o);
      const fecha = new Date(o.fecha + "Z").toLocaleString('es-CO', { timeZone: 'America/Bogota' });

      document.getElementById('newOrderQueueBadge').textContent =
        colaNuevasOrdenes.length > 1 ? `${colaNuevasOrdenes.length} nuevas` : '1 nueva';

      document.getElementById('modalPagoSelect').value = estadoPagoActual;

      document.getElementById('newOrderDetails').innerHTML = `
        <div class="order-detail-row">
          <span class="order-detail-label">Orden</span>
          <span class="order-detail-value" style="color:#c81d4e; font-size:16px;">${o.numero_orden}</span>
        </div>
        <div class="order-detail-row">
          <span class="order-detail-label">Cliente</span>
          <span class="order-detail-value">${o.nombre || 'Sin nombre'}</span>
        </div>
        <div class="order-detail-row">
          <span class="order-detail-label">WhatsApp</span>
          <span class="order-detail-value">${o.celular}</span>
        </div>
        <div class="order-detail-row">
          <span class="order-detail-label">Servicio</span>
          <span class="order-detail-value">No Registro ${o.operador}</span>
        </div>
        <div class="order-detail-row">
          <span class="order-detail-label">IMEI</span>
          <span class="order-detail-value mono">${o.imei}</span>
        </div>
        <div class="order-detail-row">
          <span class="order-detail-label">Valor</span>
          <span class="order-detail-value" style="color:#059669;">${o.precio}</span>
        </div>
        <div class="order-detail-row">
          <span class="order-detail-label">Comprobante</span>
          <span class="order-detail-value">
            ${o.comprobante_url
              ? `<a href="${o.comprobante_url}" target="_blank" style="color:#2563eb; text-decoration:underline;">📷 Ver Comprobante</a>`
              : '<span style="color:#94a3b8;">Sin foto adjunta</span>'}
          </span>
        </div>
        <div class="order-detail-row">
          <span class="order-detail-label">Hora</span>
          <span class="order-detail-value" style="font-size:12px; color:#64748b;">${fecha}</span>
        </div>
      `;

      overlay.classList.add('open');
    }

    function cerrarAvisoNuevaOrden() {
      if (ordenActualModal) {
        marcarOrdenComoVista(ordenActualModal.numero_orden);
        colaNuevasOrdenes.shift();
      }
      mostrarSiguienteOrdenModal();
    }

    async function procesarOrdenModal(nuevoEstado) {
      if (!ordenActualModal) return;
      const btnAccept = document.getElementById('btnModalAccept');
      const btnReject = document.getElementById('btnModalReject');
      btnAccept.disabled = true;
      btnReject.disabled = true;

      try {
        const numeroOrden = ordenActualModal.numero_orden;
        const pagoSeleccionado = document.getElementById('modalPagoSelect').value;
        guardarEstadoPagoLocal(numeroOrden, pagoSeleccionado);
        await cambiarEstado(numeroOrden, nuevoEstado);
        marcarOrdenComoVista(numeroOrden);
        colaNuevasOrdenes.shift();
        mostrarSiguienteOrdenModal();
      } finally {
        btnAccept.disabled = false;
        btnReject.disabled = false;
      }
    }

    function renderOrdenes(lista) {
      const tbody = document.getElementById('tablaOrdenes');
      const filtroVal = document.getElementById('filtroCliente').value;
      const filtroPagoVal = document.getElementById('filtroPago').value;
      const textoBusqueda = String(document.getElementById('buscadorOrdenes').value || '').trim().toLowerCase();

      let filtradas = lista.map(o => ({ ...o, _pago: resolverEstadoPago(o) }));

      if (filtroVal) {
        const [pinSel, celSel] = filtroVal.split('||');
        filtradas = filtradas.filter(o =>
          (pinSel && String(o.pin || '') === pinSel) ||
          (celSel && String(o.celular || '') === celSel)
        );
      }

      if (filtroPagoVal) {
        filtradas = filtradas.filter(o => o._pago === filtroPagoVal);
      }

      if (textoBusqueda) {
        filtradas = filtradas.filter(o =>
          String(o.numero_orden || '').toLowerCase().includes(textoBusqueda) ||
          String(o.celular || '').toLowerCase().includes(textoBusqueda) ||
          String(o.imei || '').toLowerCase().includes(textoBusqueda) ||
          String(o.nombre || '').toLowerCase().includes(textoBusqueda)
        );
      }

      tbody.innerHTML = '';
      if (filtradas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align: center; padding: 30px;">No hay órdenes para este filtro.</td></tr>';
        return;
      }

      filtradas.forEach(o => {
        const tr = document.createElement('tr');
        const fecha = new Date(o.fecha + "Z").toLocaleString('es-CO', { timeZone: 'America/Bogota' });
        const pagoActual = o._pago;
        const pagoBadgeClass = pagoActual === 'Pagado' ? 'badge-Pagado' : 'badge-No-Pagado';

        let estadoClass = 'Pendiente';
        if (o.estado === 'En Proceso') estadoClass = 'Proceso';
        if (o.estado === 'Exitoso') estadoClass = 'Exitoso';
        if (o.estado === 'Rechazado') estadoClass = 'Rechazado';

        const selectOptions = `
          <option value="Pendiente" ${o.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
          <option value="En Proceso" ${o.estado === 'En Proceso' ? 'selected' : ''}>En Proceso</option>
          <option value="Exitoso" ${o.estado === 'Exitoso' ? 'selected' : ''}>Exitoso</option>
          <option value="Rechazado" ${o.estado === 'Rechazado' ? 'selected' : ''}>Rechazado</option>
        `;

        const pagoOptions = `
          <option value="Pagado" ${pagoActual === 'Pagado' ? 'selected' : ''}>Pagado</option>
          <option value="No Pagado" ${pagoActual === 'No Pagado' ? 'selected' : ''}>No Pagado</option>
        `;

        tr.innerHTML = `
          <td><strong>${o.numero_orden}</strong></td>
          <td style="font-size: 12px; color:#64748b;">${fecha}</td>
          <td>${o.nombre || 'Sin nombre'}</td>
          <td><strong>${o.celular}</strong></td>
          <td>${o.operador}</td>
          <td style="font-family: monospace;">${o.imei}</td>
          <td><strong>${o.precio}</strong></td>
          <td>
            ${o.comprobante_url
              ? `<a href="${o.comprobante_url}" target="_blank" style="color: #2563eb; font-weight: bold; text-decoration: underline;">Ver Foto</a>`
              : 'Sin foto'}
          </td>
          <td>
            <div style="display:flex; flex-direction:column; gap:5px; align-items:flex-start;">
              <span class="badge ${pagoBadgeClass}">${pagoActual}</span>
              <select class="pago-select" onchange="cambiarPago('${o.numero_orden}', this.value)">
                ${pagoOptions}
              </select>
            </div>
          </td>
          <td><span class="badge badge-${estadoClass}">${o.estado}</span></td>
          <td>
            <select class="estado-select" onchange="cambiarEstado('${o.numero_orden}', this.value)">
              ${selectOptions}
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function cambiarPago(numeroOrden, nuevoPago) {
      guardarEstadoPagoLocal(numeroOrden, nuevoPago);
      ordenesCache = ordenesCache.map(o =>
        o.numero_orden === numeroOrden ? { ...o, pago: nuevoPago } : o
      );
      renderOrdenes(ordenesCache);

      try {
        await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'update_payment',
            numero_orden: numeroOrden,
            pago: nuevoPago,
            admin_token: 'admin'
          })
        });
      } catch (err) {}
    }

    // --- CARGAR ÓRDENES ---
    async function cargarOrdenes(silencioso = false) {
      const tbody = document.getElementById('tablaOrdenes');
      if (!silencioso && ordenesCache.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align: center; padding: 30px;">Cargando...</td></tr>';
      }

      try {
        const res = await fetch(WORKER_URL + "?action=get_orders");
        const data = await res.json();

        if (data.success) {
          ordenesCache = data.ordenes || [];
          renderOrdenes(ordenesCache);
          evaluarNuevasOrdenes(ordenesCache);
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        if (!silencioso) {
          tbody.innerHTML = `<tr><td colspan="11" style="text-align: center; color: red; padding: 30px;">Error: ${err.message}</td></tr>`;
        }
      }
    }

    // --- CARGAR CLIENTES ---
    async function cargarClientes() {
      const tbody = document.getElementById('tablaClientes');
      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 30px;">Cargando...</td></tr>';

      try {
        const res = await fetch(WORKER_URL + "?action=get_clients");
        const data = await res.json();

        if (data.success) {
          clientesCache = data.clientes || [];
          poblarFiltroClientes();
          tbody.innerHTML = '';
          if (clientesCache.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 30px;">No hay clientes registrados aún.</td></tr>';
            return;
          }

          clientesCache.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${c.id}</td>
              <td><strong>${c.nombre}</strong></td>
              <td>${c.celular}</td>
              <td style="font-family: monospace; font-size: 16px; font-weight: bold;">${c.pin}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red; padding: 30px;">Error: ${err.message}</td></tr>`;
      }
    }

    // --- ACTUALIZAR ESTADO ---
    async function cambiarEstado(numeroOrden, nuevoEstado) {
      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'update_status',
            numero_orden: numeroOrden,
            estado: nuevoEstado,
            admin_token: 'admin'
          })
        });
        const data = await res.json();

        if (data.success) {
          marcarOrdenComoVista(numeroOrden);
          await cargarOrdenes(true);
        } else {
          alert("Error al actualizar: " + data.error);
        }
      } catch (err) {
        alert("Error de conexión al actualizar.");
      }
    }
  </script>
</body>
