<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración — Zona GSM</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #eef2f6; padding: 20px; color: #111827; margin: 0; }

    /* Estilos del Login */
    .login-box { max-width: 320px; margin: 100px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; }
    .login-box button { width: 100%; padding: 12px; background: #c81d4e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }

    /* Estilos del Panel */
    .panel { display: none; max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .header h1 { font-size: 24px; color: #0f172a; margin: 0; }
    .btn-refresh { padding: 10px 20px; background: #0f172a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

    /* Pestañas (Tabs) */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #cbd5e1; }
    .tab-btn { padding: 10px 20px; background: none; border: none; font-size: 16px; font-weight: 700; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .tab-btn.active { color: #c81d4e; border-bottom-color: #c81d4e; }
    .tab-btn:hover { color: #0f172a; }

    /* Tablas */
    .table-container { background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f8fafc; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }

    /* Estados */
    .badge { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge-Pendiente { background: #fef3c7; color: #d97706; }
    .badge-Proceso { background: #e0f2fe; color: #0284c7; }
    .badge-Exitoso { background: #dcfce7; color: #16a34a; }

    /* Menú desplegable de acciones */
    select.estado-select { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 700; font-size: 13px; cursor: pointer; outline: none; background: #f8fafc; color: #334155; width: 100%; max-width: 150px; transition: all 0.2s; }
    select.estado-select:hover { background: #e2e8f0; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginBox" class="login-box">
    <h2 style="margin-top: 0; color: #0f172a;">Zona GSM Admin</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Ingresa tus credenciales</p>
    <input type="text" id="userInput" placeholder="Usuario" value="admin">
    <input type="password" id="passwordInput" placeholder="Contraseña" value="admin">
    <button onclick="login()">Ingresar al Panel</button>
  </div>

  <!-- PANEL -->
  <div id="adminPanel" class="panel">
    <div class="header">
      <h1>Zona GSM Admin</h1>
      <button class="btn-refresh" onclick="recargarTodo()">🔄 Actualizar Datos</button>
    </div>

    <!-- Pestañas -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-orders-btn" onclick="showTab('orders')">Órdenes</button>
      <button class="tab-btn" id="tab-clients-btn" onclick="showTab('clients')">Clientes Registrados</button>
    </div>

    <!-- VISTA: ÓRDENES -->
    <div id="view-orders" class="table-container">
      <table>
        <thead>
          <tr>
            <th>Orden</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>WhatsApp</th>
            <th>Servicio</th>
            <th>IMEI</th>
            <th>Precio</th>
            <th>Comprobante</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaOrdenes">
          <tr><td colspan="10" style="text-align: center; padding: 30px;">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- VISTA: CLIENTES -->
    <div id="view-clients" class="table-container hidden">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre / Negocio</th>
            <th>Número de WhatsApp</th>
            <th>PIN</th>
          </tr>
        </thead>
        <tbody id="tablaClientes">
          <tr><td colspan="4" style="text-align: center; padding: 30px;">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://telegram-zonagsm.zonagsm023.workers.dev";

    function login() {
      const u = document.getElementById('userInput').value;
      const p = document.getElementById('passwordInput').value;

      if (u === 'admin' && p === 'admin') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        localStorage.setItem('zg_admin_logged', 'true');
        recargarTodo();
      } else {
        alert("Usuario o contraseña incorrectos");
      }
    }

    if (localStorage.getItem('zg_admin_logged') === 'true') {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      recargarTodo();
    }

    function showTab(tabName) {
      // Cambiar estilos de los botones
      document.getElementById('tab-orders-btn').classList.remove('active');
      document.getElementById('tab-clients-btn').classList.remove('active');

      if (tabName === 'orders') {
        document.getElementById('tab-orders-btn').classList.add('active');
        document.getElementById('view-orders').classList.remove('hidden');
        document.getElementById('view-clients').classList.add('hidden');
      } else {
        document.getElementById('tab-clients-btn').classList.add('active');
        document.getElementById('view-clients').classList.remove('hidden');
        document.getElementById('view-orders').classList.add('hidden');
      }
    }

    function recargarTodo() {
      cargarOrdenes();
      cargarClientes();
    }

    // --- CARGAR ÓRDENES ---
    async function cargarOrdenes() {
      const tbody = document.getElementById('tablaOrdenes');
      tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 30px;">Cargando...</td></tr>';

      try {
        const res = await fetch(WORKER_URL + "?action=get_orders");
        const data = await res.json();

        if (data.success) {
          tbody.innerHTML = '';
          if (data.ordenes.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 30px;">No hay órdenes registradas aún.</td></tr>';
            return;
          }

          data.ordenes.forEach(o => {
            const tr = document.createElement('tr');
            const fecha = new Date(o.fecha + "Z").toLocaleString('es-CO', { timeZone: 'America/Bogota' });

            let estadoClass = 'Pendiente';
            if (o.estado === 'En Proceso') estadoClass = 'Proceso';
            if (o.estado === 'Exitoso') estadoClass = 'Exitoso';

            const selectOptions = `
              <option value="Pendiente" ${o.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
              <option value="En Proceso" ${o.estado === 'En Proceso' ? 'selected' : ''}>En Proceso</option>
              <option value="Exitoso" ${o.estado === 'Exitoso' ? 'selected' : ''}>Exitoso</option>
            `;

            tr.innerHTML = `
              <td><strong>${o.numero_orden}</strong></td>
              <td style="font-size: 12px; color:#64748b;">${fecha}</td>
              <td>${o.nombre || 'Sin nombre'}</td>
              <td><strong>${o.celular}</strong></td>
              <td>${o.operador}</td>
              <td style="font-family: monospace;">${o.imei}</td>
              <td><strong>${o.precio}</strong></td>
              <td>
                ${o.comprobante_url
                  ? `<a href="${o.comprobante_url}" target="_blank" style="color: #2563eb; font-weight: bold; text-decoration: underline;">Ver Foto</a>`
                  : 'Sin foto'}
              </td>
              <td><span class="badge badge-${estadoClass}">${o.estado}</span></td>
              <td>
                <select class="estado-select" onchange="cambiarEstado('${o.numero_orden}', this.value)">
                  ${selectOptions}
                </select>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: red; padding: 30px;">Error: ${err.message}</td></tr>`;
      }
    }

    // --- CARGAR CLIENTES ---
    async function cargarClientes() {
      const tbody = document.getElementById('tablaClientes');
      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 30px;">Cargando...</td></tr>';

      try {
        const res = await fetch(WORKER_URL + "?action=get_clients");
        const data = await res.json();

        if (data.success) {
          tbody.innerHTML = '';
          if (data.clientes.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 30px;">No hay clientes registrados aún.</td></tr>';
            return;
          }

          data.clientes.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${c.id}</td>
              <td><strong>${c.nombre}</strong></td>
              <td>${c.celular}</td>
              <td style="font-family: monospace; font-size: 16px; font-weight: bold;">${c.pin}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red; padding: 30px;">Error: ${err.message}</td></tr>`;
      }
    }

    // --- ACTUALIZAR ESTADO ---
    async function cambiarEstado(numeroOrden, nuevoEstado) {
      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'update_status',
            numero_orden: numeroOrden,
            estado: nuevoEstado,
            admin_token: 'admin'
          })
        });
        const data = await res.json();

        if (data.success) {
          cargarOrdenes(); // Recargar la tabla
        } else {
          alert("Error al actualizar: " + data.error);
        }
      } catch (err) {
        alert("Error de conexión al actualizar.");
      }
    }
  </script>
</body>
</html>
