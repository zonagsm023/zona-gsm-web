<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zona GSM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .breathing-box {
      background-color: #ffffff;
      color: #0f172a;
      padding: 40px 56px;
      border-radius: 24px;
      border: 2px solid rgba(200, 29, 78, 0.25);
      box-shadow: 0 10px 30px rgba(200, 29, 78, 0.12);
      text-align: center;
      animation: breatheBox 3.5s ease-in-out infinite;
    }

    .breathing-box h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    @keyframes breatheBox {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 30px rgba(200, 29, 78, 0.12);
        border-color: rgba(200, 29, 78, 0.25);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 18px 45px rgba(200, 29, 78, 0.28);
        border-color: rgba(200, 29, 78, 0.65);
      }
    }
  </style>
</head>
<body>

  <div class="breathing-box">
    <h1>chiqui es gay</h1>
  </div>

</body>
</html>
